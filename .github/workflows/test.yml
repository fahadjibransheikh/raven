name: Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "Casks/**"
      - "screenshots/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "Casks/**"
      - "screenshots/**"
  # The release workflow calls this before drafting a release.
  workflow_call:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The JS tests run app.js in jsdom and render the popover with go run.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Go tests
        run: go test ./...

      - name: JS tests
        run: |
          npm ci
          npm test
