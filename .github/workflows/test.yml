name: Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "Casks/**"
      - "screenshots/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "Casks/**"
      - "screenshots/**"
  # The release workflow calls this before drafting a release.
  workflow_call:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The JS tests run app.js in jsdom and render the popover with go run.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Go tests
        run: go test ./...

      - name: JS tests
        run: |
          npm ci
          npm test
