name: Build Raven desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# contents: write lets create-release/publish manage the release and push the
# Homebrew cask bump, and lets tauri-action upload assets with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # A pushed v* tag fully publishes a release: this job makes a DRAFT (invisible
  # to the updater and to "latest"), build uploads into it, publish flips it
  # live only after every platform succeeded. workflow_dispatch skips all of it.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Cargo.toml is the single version source (tauri.conf.json has none).
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' tauri-wrapper/src-tauri/Cargo.toml | head -n1)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION (expected v$VERSION). Bump the version, commit, and re-tag."
            exit 1
          fi

          # Quoted heredoc so the backticks stay literal; @VERSION@ is filled in below.
          cat > notes.md <<'NOTES'
          ## Downloads

          - **macOS (Apple Silicon):** `Raven_@VERSION@_aarch64.dmg`
          - **Windows (x64):** `Raven_@VERSION@_x64-setup.exe` or `Raven_@VERSION@_x64_en-US.msi`
          - **Linux (x86_64):** `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), or the portable `.AppImage`

          ## Homebrew (macOS)

          ```
          brew tap fahadjibransheikh/raven https://github.com/fahadjibransheikh/raven
          brew install --cask fahadjibransheikh/raven/raven
          ```

          The macOS app is not signed or notarized yet. If macOS says it can't verify Raven, open System Settings → Privacy & Security and click **Open Anyway**. (The Homebrew install doesn't need this.)

          Installed copies update themselves: Raven checks for new versions on launch, and the tray menu has **Check for Updates…**. On Linux this applies to the AppImage; for .deb/.rpm, install the new package.

          ## Changes

          _Release notes to follow._
          NOTES
          sed -i.bak "s/@VERSION@/$VERSION/g" notes.md

          # The REST API returns the id directly; `gh release view` can't look up drafts by tag.
          ID="$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="Raven $VERSION" -F body=@notes.md \
            -F draft=true --jq .id)"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # create-release is skipped on workflow_dispatch; don't let that skip the build.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target_triple: aarch64-apple-darwin
            ext: ""
            bundles: app,dmg
          - os: ubuntu-22.04
            target_triple: x86_64-unknown-linux-gnu
            ext: ""
            bundles: deb,rpm,appimage
          - os: windows-latest
            target_triple: x86_64-pc-windows-msvc
            ext: ".exe"
            bundles: msi,nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-wrapper/src-tauri

      - name: Put Go and Cargo bins on PATH
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install task, templ, and tauri-cli
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/a-h/templ/cmd/templ@v0.3.1001
          cargo install tauri-cli --version "^2" --locked

      - name: Install standalone Tailwind CSS CLI
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   TW_ASSET=tailwindcss-macos-arm64 ;;
            Linux)   TW_ASSET=tailwindcss-linux-x64 ;;
            Windows) TW_ASSET=tailwindcss-windows-x64.exe ;;
          esac
          # Go's bin dir is already on PATH (see above) in a form Windows
          # understands, and Windows only finds the binary with its .exe suffix.
          TW_BIN="$(go env GOPATH)/bin/tailwindcss${{ matrix.ext }}"
          curl -sL -o "$TW_BIN" \
            "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/${TW_ASSET}"
          chmod +x "$TW_BIN"

      - name: Build the Go sidecar (native to this runner)
        shell: bash
        run: |
          task generate
          go build -tags embedded_assets -trimpath \
            -o "tauri-wrapper/src-tauri/binaries/gofer-${{ matrix.target_triple }}${{ matrix.ext }}" .

      - name: Regenerate app icon set from the source PNG
        shell: bash
        working-directory: tauri-wrapper/src-tauri
        run: cargo tauri icon icons/icon.png

      # On a tag: builds, signs the updater artifacts, uploads bundles + .sig
      # files into the draft release and merges this platform into latest.json.
      # On workflow_dispatch releaseId is empty, so it only builds. `app` in the
      # macOS bundle list is what yields the .app.tar.gz the updater installs.
      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-wrapper
          tauriScript: cargo tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raven-${{ runner.os }}-${{ matrix.target_triple }}
          path: |
            tauri-wrapper/src-tauri/target/release/bundle/**
          if-no-files-found: error

  # Runs only when all three platforms built. Un-drafting last means the updater
  # (which reads releases/latest/download/latest.json) never sees a release
  # that is missing latest.json or a platform's bundle.
  publish:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      # The three build jobs each merge their platform into latest.json on the
      # release; if two finish at once one merge can be lost. Refuse to go live
      # with an incomplete file, since the updater would 404 for that platform.
      - name: Check latest.json lists every platform
        run: |
          ASSET_ID="$(gh api "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')"
          if [ -z "$ASSET_ID" ]; then
            echo "::error::The release has no latest.json."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/$ASSET_ID" > latest.json
          for platform in darwin-aarch64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p]' latest.json > /dev/null || {
              echo "::error::latest.json is missing $platform. Re-run the failed job, or re-run the workflow."
              exit 1
            }
          done

      - name: Publish the release and mark it latest
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false -f make_latest=true

      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Point the Homebrew cask at the new release
        run: |
          MAC_FILE="Raven_${VERSION}_aarch64.dmg"
          LINUX_FILE="Raven_${VERSION}_amd64.AppImage"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "$MAC_FILE" --pattern "$LINUX_FILE"
          MAC_SHA="$(sha256sum "$MAC_FILE" | cut -d' ' -f1)"
          LINUX_SHA="$(sha256sum "$LINUX_FILE" | cut -d' ' -f1)"
          rm "$MAC_FILE" "$LINUX_FILE"
          sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                 -e "s/^\(  sha256 arm: *\)\"[0-9a-f]*\"/\1\"$MAC_SHA\"/" \
                 -e "s/^\( *x86_64_linux: *\)\"[0-9a-f]*\"/\1\"$LINUX_SHA\"/" Casks/raven.rb
          # A changed cask layout would make the edits above silently miss.
          grep -q "\"$MAC_SHA\"" Casks/raven.rb && grep -q "\"$LINUX_SHA\"" Casks/raven.rb || {
            echo "::error::Casks/raven.rb was not updated with both checksums."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/raven.rb
          git commit -m "Update Homebrew cask to $VERSION"
          git pull --rebase origin master
          git push origin HEAD:master
