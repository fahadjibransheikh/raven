[package]
name = "gofer-desktop"
version = "0.2.2"
description = "Native desktop wrapper for the Raven email client"
edition = "2021"
rust-version = "1.90"

# See https://v2.tauri.app/reference/config/ for tauri.conf.json.
# See https://v2.tauri.app/develop/sidecar/ for the sidecar mechanism used here.

[lib]
# The library name (crate-type) is required by Tauri's mobile entry-point
# macro even though this app is desktop-only; `staticlib`/`cdylib` are what
# `cargo tauri` expects to find when it links the final binary.
name = "gofer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in Cargo.lock via tauri; used directly for the per-launch desktop token.
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# mailto: handler. single-instance (with its deep-link feature) makes a second
# launch, which is how Windows/Linux deliver a mailto: click, forward the URL
# to the running app instead of starting another sidecar.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
